<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Dragon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- bracket-terminal requires a canvas with id="canvas" to exist in the DOM -->
  <canvas id="canvas"></canvas>

  <!-- ── Menu overlay ── -->
  <div id="menu-overlay" class="overlay">
    <div class="menu-bg" id="menu-bg"></div>
    <div class="menu-bg-dim"></div>
    <div class="menu-content">
      <div class="game-title">FLAPPY<br>DRAGON</div>
      <div class="mode-btns">
        <button id="play-classic-btn" class="btn-primary btn-mode" disabled>▶ CLASSIC</button>
        <button id="play-new-btn"     class="btn-primary btn-mode" disabled>✦ NEW</button>
      </div>
      <div class="name-group">
        <div class="name-label">YOUR NAME</div>
        <input id="name-input" class="name-input" type="text"
               placeholder="anonymous" maxlength="32" autocomplete="off">
        <div class="name-note">leave empty → score not saved</div>
      </div>
      <button id="scores-btn" class="btn-secondary">🏆 SCORE TABLE</button>
    </div>
  </div>

  <!-- ── Game Over overlay ── -->
  <div id="gameover-overlay" class="overlay">
    <div class="go-header">GAME OVER</div>
    <div class="go-emoji">💀</div>
    <div class="result-box">
      <div class="result-name" id="go-player-name">ANONYMOUS</div>
      <div class="result-score" id="go-score">0 pts</div>
      <div class="result-pos" id="go-position" style="display:none">
        Position <span></span>
      </div>
      <div class="result-anon" id="go-anon" style="display:none">
        SCORE NOT SAVED
      </div>
    </div>
    <table class="score-table" id="go-score-table"></table>
    <div class="btn-row">
      <button id="go-play-again-btn" class="btn-primary">▶ PLAY AGAIN</button>
      <button id="go-menu-btn" class="btn-secondary">⌂ MENU</button>
    </div>
  </div>

  <!-- ── Scores overlay ── -->
  <div id="scores-overlay" class="overlay">
    <div class="scores-title">🏆 SCORE TABLE</div>
    <div class="scores-table-wrap">
      <table class="score-table" id="scores-table"></table>
    </div>
    <br>
    <button id="scores-back-btn" class="btn-secondary">← BACK</button>
  </div>

  <img id="dragon-sprite" src="dragon.svg"
       style="display:none; position:fixed; z-index:1; pointer-events:none; width:88px; height:auto;">

  <!-- ── Win overlay ── -->
  <div id="win-overlay" class="overlay" style="display:none; background: radial-gradient(ellipse at center, #050530 0%, #010108 70%);">
    <div style="font-size:52px; margin-bottom:8px;">🌟</div>
    <div class="win-title">¡FELICITACIONES!</div>
    <div class="win-subtitle">GANASTE</div>
    <div class="win-desc">Te fuiste del sistema solar</div>
    <div class="win-desc" style="color:#aaaaff; font-size:13px; margin-top:4px;">
      Pasaste la Nube de Oort
    </div>
    <div class="result-box" style="margin-top:20px; margin-bottom:20px;">
      <div class="result-name" id="win-player-name">ANONYMOUS</div>
      <div class="result-score" id="win-score-display">0 pts</div>
    </div>
    <div class="btn-row">
      <button id="win-play-again-btn" class="btn-primary" style="margin-bottom:0; padding:9px 24px; font-size:14px;">▶ JUGAR DE NUEVO</button>
      <button id="win-menu-btn" class="btn-secondary">⌂ MENÚ</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
