<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10" width="48" height="30" shape-rendering="crispEdges">
  <!-- Horn -->
  <rect x="13" y="0" width="1" height="1" fill="#f5a623"/>
  <rect x="12" y="1" width="2" height="1" fill="#f5a623"/>
  <!-- Head -->
  <rect x="11" y="2" width="2" height="1" fill="#3a9e3f"/>
  <rect x="13" y="2" width="1" height="1" fill="#f5a623"/>
  <!-- Eye + jaw -->
  <rect x="10" y="3" width="1" height="1" fill="#111111"/>
  <rect x="11" y="3" width="1" height="1" fill="white"/>
  <rect x="12" y="3" width="2" height="1" fill="#3a9e3f"/>
  <rect x="14" y="3" width="1" height="1" fill="#f5a623"/>
  <!-- Wing (upper-left of body) -->
  <rect x="3" y="4" width="2" height="1" fill="#5abf60"/>
  <rect x="2" y="5" width="3" height="1" fill="#5abf60"/>
  <rect x="1" y="6" width="2" height="1" fill="#5abf60"/>
  <!-- Body -->
  <rect x="8" y="4" width="5" height="1" fill="#3a9e3f"/>
  <rect x="6" y="5" width="6" height="1" fill="#3a9e3f"/>
  <rect x="5" y="6" width="5" height="1" fill="#3a9e3f"/>
  <!-- Belly highlight -->
  <rect x="7" y="5" width="3" height="1" fill="#4db050"/>
  <!-- Tail -->
  <rect x="4" y="7" width="4" height="1" fill="#3a9e3f"/>
  <rect x="3" y="8" width="3" height="1" fill="#3a9e3f"/>
  <rect x="2" y="9" width="2" height="1" fill="#2d7a33"/>
</svg>
