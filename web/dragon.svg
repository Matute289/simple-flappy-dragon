<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 10" width="48" height="15" shape-rendering="crispEdges">
  <!-- Tail tip -->
  <rect x="0" y="4" width="2" height="2" fill="#2d7a33"/>
  <rect x="2" y="3" width="3" height="3" fill="#3a9e3f"/>

  <!-- Body with scale highlights -->
  <rect x="5"  y="3" width="18" height="4" fill="#3a9e3f"/>
  <rect x="6"  y="2" width="2"  height="1" fill="#4db050"/>
  <rect x="10" y="2" width="2"  height="1" fill="#4db050"/>
  <rect x="14" y="2" width="2"  height="1" fill="#4db050"/>
  <rect x="18" y="2" width="2"  height="1" fill="#4db050"/>
  <!-- Belly (lighter stripe) -->
  <rect x="5"  y="6" width="18" height="1" fill="#5abf60"/>

  <!-- Neck -->
  <rect x="23" y="2" width="2"  height="5" fill="#3a9e3f"/>

  <!-- Head -->
  <rect x="25" y="1" width="5"  height="6" fill="#3a9e3f"/>

  <!-- Antlers (branched, orange — Chinese dragon style) -->
  <rect x="27" y="0" width="1"  height="2" fill="#f5a623"/>
  <rect x="29" y="0" width="1"  height="2" fill="#f5a623"/>
  <rect x="28" y="1" width="2"  height="1" fill="#f5a623"/>

  <!-- Eye -->
  <rect x="28" y="2" width="2"  height="2" fill="white"/>
  <rect x="29" y="2" width="1"  height="1" fill="#111111"/>

  <!-- Snout -->
  <rect x="30" y="3" width="2"  height="3" fill="#3a9e3f"/>
  <rect x="31" y="4" width="1"  height="2" fill="#f5a623"/>

  <!-- Whiskers / beard (hanging down — distinctive Chinese dragon feature) -->
  <rect x="28" y="7" width="1"  height="2" fill="#f5a623"/>
  <rect x="30" y="7" width="1"  height="2" fill="#f5a623"/>
</svg>
