[package]
name = "flappy_dragon"
version = "0.1.0"
authors = ["Matias Grinberg Soldaini <matias.grinberg@mercadolibre.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bracket-lib = "~0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[patch.crates-io]
ctrlc = { path = "patches/ctrlc" }
