server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve flappy-scores at request time via Docker DNS
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $scores http://flappy-scores:8080;
        proxy_pass $scores/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
