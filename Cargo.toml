[package]
name = "flappy_dragon"
version = "1.0.0"
authors = ["Matias Grinberg Soldaini <matias.grinberg@mercadolibre.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bracket-lib = "=0.8.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[patch.crates-io]
ctrlc = { path = "patches/ctrlc" }
