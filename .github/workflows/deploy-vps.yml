name: Deploy to VPS

on:
  push:
    branches: [browser]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build flappy-dragon WASM image and deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build flappy-dragon image
        run: |
          docker buildx build --load \
            -f deploy/Dockerfile.vps \
            -t flappy-dragon:latest .

      - name: Save image as tarball
        run: docker save flappy-dragon:latest | gzip > flappy-dragon.tar.gz

      # Deploy through the restricted `deploy` user (MyServerVPS Stage 8): the key can only upload
      # an image tarball to its own inbox and run `deploy`; the server validates the tag, loads the image
      # and recreates the container. Compose files live on the server (/opt/...), not in CI.
      - name: Upload image and deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY_FLAPPY_DRAGON }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          rsync -e "$SSH" flappy-dragon.tar.gz "deploy@${VPS_HOST}:image.tar.gz"
          $SSH "deploy@${VPS_HOST}" deploy
